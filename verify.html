<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Affidavit Validation</title>

<style>

/* =========================================================
   PAGE
========================================================= */

body{
    background-color:#d1d5db;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}


/* =========================================================
   LOADER OVERLAY
========================================================= */

#loader-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-color:#d1d5db;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:9999;
}


/* =========================================================
   LOADER CARD
========================================================= */

.loader-card{
    background:white;

    padding:50px;

    border-radius:8px;

    box-shadow:0 10px 25px rgba(0,0,0,0.1);

    display:flex;
    justify-content:center;
    align-items:center;

    width:282px;
    height:272px;

    box-sizing:border-box;
}


/* =========================================================
   LARGE SPINNER
========================================================= */

.spinner{
    width:60px;
    height:60px;

    display:block;
}


/*
   IMPORTANT:

   The spinner itself does NOT rotate.

   Every line remains physically in the same position.

   Only the opacity/faded color moves from one line
   to the next.
*/

.spinner-bar{
    fill:#333;

    animation:
        spinnerFade 1.1s linear infinite;
}


/* Each line receives a different delay */

.spinner-bar:nth-child(1){
    animation-delay:0s;
}

.spinner-bar:nth-child(2){
    animation-delay:-0.091s;
}

.spinner-bar:nth-child(3){
    animation-delay:-0.182s;
}

.spinner-bar:nth-child(4){
    animation-delay:-0.273s;
}

.spinner-bar:nth-child(5){
    animation-delay:-0.364s;
}

.spinner-bar:nth-child(6){
    animation-delay:-0.455s;
}

.spinner-bar:nth-child(7){
    animation-delay:-0.546s;
}

.spinner-bar:nth-child(8){
    animation-delay:-0.637s;
}

.spinner-bar:nth-child(9){
    animation-delay:-0.728s;
}

.spinner-bar:nth-child(10){
    animation-delay:-0.819s;
}

.spinner-bar:nth-child(11){
    animation-delay:-0.910s;
}

.spinner-bar:nth-child(12){
    animation-delay:-1.001s;
}


@keyframes spinnerFade{

    0%{
        opacity:1;
    }

    8%{
        opacity:1;
    }

    16%{
        opacity:0.91;
    }

    25%{
        opacity:0.75;
    }

    33%{
        opacity:0.58;
    }

    42%{
        opacity:0.41;
    }

    50%{
        opacity:0.25;
    }

    58%{
        opacity:0.16;
    }

    66%{
        opacity:0.08;
    }

    75%{
        opacity:0.08;
    }

    100%{
        opacity:1;
    }
}


/* =========================================================
   MAIN INFORMATION CARD
========================================================= */

.card{

    background:white;

    padding:40px 30px;

    border-radius:8px;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.1);

    max-width:400px;

    width:77%;

    text-align:center;

    position:fixed;

    display:none;

    box-sizing:border-box;
}


/* =========================================================
   PHOTOS
========================================================= */

.photo-container{

    display:flex;

    justify-content:center;

    gap:20px;

    margin-bottom:25px;
}


/* =========================================================
   PASSPORT
========================================================= */

.passport-circle{

    width:100px;

    height:100px;

    border-radius:50%;

    overflow:hidden;

    border:1px solid #ddd;

    background:#f5f5f5;

    display:flex;

    align-items:center;

    justify-content:center;
}


.passport-circle img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}


/* =========================================================
   SIGNATURE
========================================================= */

.signature-box{

    width:100px;

    height:100px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}


.signature-box img{

    max-width:100%;

    max-height:100%;

    object-fit:contain;

    display:block;
}


/* =========================================================
   INFORMATION TEXT
========================================================= */

.info-text{

    color:#333;

    font-size:15px;

    line-height:1.5;

    margin-bottom:20px;
}


/* =========================================================
   GREEN TEXT
========================================================= */

.highlight-green{

    color:#27ae60;

    font-weight:bold;
}


/* =========================================================
   INVALID RED
========================================================= */

.highlight-invalid{

    color:#e74c3c !important;

    font-weight:bold;
}


/* =========================================================
   LOGIN LINK
========================================================= */

.login-link{

    display:block;

    text-align:right;

    color:#333;

    text-decoration:underline;

    font-size:14px;

    margin-top:20px;
}


/* =========================================================
   IMAGE LOADING PLACEHOLDER
========================================================= */

.image-loading{

    background:#f1f1f1;

}


/* =========================================================
   SMALL MOBILE ADJUSTMENT

   This does NOT change the desktop design.
========================================================= */

@media(max-width:450px){

    .loader-card{

        width:282px;

        height:272px;
    }

    .spinner{

        width:78px;

        height:78px;
    }

    .card{

        width:77%;

        padding:40px 30px;
    }

}

</style>
</head>


<body>


<!-- ========================================================
     LOADER
========================================================= -->

<div id="loader-overlay">

    <div class="loader-card">

        <!--
            The SVG does not rotate.

            The individual lines remain fixed.

            Only their opacity changes.
        -->

        <svg
            class="spinner"
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Loading"
        >

            <g>

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(30 50 50)"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(60 50 50)"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(90 50 50)"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(120 50 50)"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(150 50 50)"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(180 50 50)"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(210 50 50)"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(240 50 50)"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(270 50 50)"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(300 50 50)"
                />

                <rect
                    class="spinner-bar"
                    x="47"
                    y="5"
                    width="6"
                    height="25"
                    rx="3"
                    transform="rotate(330 50 50)"
                />

            </g>

        </svg>

    </div>

</div>



<!-- ========================================================
     INFORMATION CARD
========================================================= -->

<div class="card" id="main-card">


    <!-- ====================================================
         PASSPORT + SIGNATURE
    ===================================================== -->

    <div class="photo-container">


        <!-- PASSPORT -->

        <div class="passport-circle">

            <img
                id="display-passport"
                src=""
                alt="Passport"
            >

        </div>


        <!-- SIGNATURE -->

        <div class="signature-box">

            <img
                id="display-sign"
                src=""
                alt="Signature"
            >

        </div>

    </div>



    <!-- ====================================================
         INFORMATION
    ===================================================== -->

    <div class="info-text">

        This is a

        <span class="highlight-green">
            GENERAL FORM OF AFFIDAVIT
        </span>

        deposed by

        <span
            class="highlight-green"
            id="display-name"
        >
            -
        </span>

        associated with code

        <span
            class="highlight-green"
            id="display-code"
        >
            -
        </span>.

        it has been<br>

        found in our database and confirmed as

        <br>

        <span
            class="highlight-green"
            id="display-valid"
        >
            VALID
        </span>

    </div>



    <!-- ====================================================
         LOGIN
    ===================================================== -->

    <a
        href="https://varms.fcthighcourt.gov.ng"
        class="login-link"
        target="_blank"
        rel="noopener noreferrer"
    >
        Go to Login
    </a>


</div>



<script>

/* =========================================================
   CONFIGURATION
========================================================= */


/*
   Your current Google Apps Script Web App.
*/

const API =
"https://script.google.com/macros/s/AKfycby_5UyMfyXI8yZdnrRR4IIh15edCDUw2Nv_IvTuvJZFstAYs18gB0HiIbN4ac5deTo_Mg/exec";


/*
   Current page elements.
*/

const loader =
document.getElementById("loader-overlay");

const card =
document.getElementById("main-card");

const displayName =
document.getElementById("display-name");

const displayCode =
document.getElementById("display-code");

const displayPassport =
document.getElementById("display-passport");

const displaySign =
document.getElementById("display-sign");

const displayValid =
document.getElementById("display-valid");


/* =========================================================
   GET CODE FROM URL
========================================================= */

const params =
new URLSearchParams(window.location.search);


/*
   Supports:

   verify.html?id=ABC123

   verify.html?code=ABC123

   verify.html?affidavitCode=ABC123
*/

const wanted =
(
    params.get("id") ||
    params.get("code") ||
    params.get("affidavitCode") ||
    ""
)
.trim()
.toUpperCase();


/* =========================================================
   INVALID STATE
========================================================= */

function showInvalid(){

    displayName.textContent =
        "UNKNOWN";

    displayCode.textContent =
        wanted || "UNKNOWN";

    displayValid.textContent =
        "INVALID";

    displayValid.classList.add(
        "highlight-invalid"
    );

    displayValid.classList.remove(
        "highlight-green"
    );

    /*
       If invalid, remove the images.
    */

    displayPassport.removeAttribute("src");

    displaySign.removeAttribute("src");
}


/* =========================================================
   VALID STATE
========================================================= */

function showValid(data){

    /*
       NAME
    */

    displayName.textContent =
        data.name ||
        "UNKNOWN";


    /*
       AFFIDAVIT CODE
    */

    displayCode.textContent =
        data.affidavitCode ||
        wanted;


    /*
       STATUS
    */

    displayValid.textContent =
        "VALID";

    displayValid.classList.remove(
        "highlight-invalid"
    );

    displayValid.classList.add(
        "highlight-green"
    );


    /*
       PASSPORT

       Add a timestamp so the browser does not
       display an old cached image.
    */

    if(data.passportUrl){

        const separator =
            data.passportUrl.includes("?")
            ? "&"
            : "?";

        displayPassport.src =
            data.passportUrl +
            separator +
            "v=" +
            Date.now();

    }


    /*
       SIGNATURE
    */

    if(data.signatureUrl){

        const separator =
            data.signatureUrl.includes("?")
            ? "&"
            : "?";

        displaySign.src =
            data.signatureUrl +
            separator +
            "v=" +
            Date.now();

    }

}


/* =========================================================
   FETCH VERIFICATION DATA
========================================================= */

async function getVerificationData(){

    /*
       No code supplied.
    */

    if(!wanted){

        showInvalid();

        return false;
    }


    /*
       Show the code immediately.

       This means the information card is already
       prepared while the loader is running.
    */

    displayCode.textContent =
        wanted;


    /*
       Request the database immediately.
    */

    const requestURL =
        API +
        "?action=verifyAffidavit" +
        "&id=" +
        encodeURIComponent(wanted) +
        "&t=" +
        Date.now();


    try{

        const response =
            await fetch(
                requestURL,
                {
                    method:"GET",

                    cache:"no-store",

                    redirect:"follow"
                }
            );


        if(!response.ok){

            throw new Error(
                "Verification server returned HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "Verification response:",
            result
        );


        /*
           Check response.
        */

        if(
            !result ||
            !result.success ||
            !result.found
        ){

            showInvalid();

            return false;
        }


        /*
           Your Apps Script returns:

           {
             success:true,
             found:true,
             data:{...}
           }
        */

        const data =
            result.data || {};


        /*
           Prepare everything BEFORE the loader
           disappears.
        */

        showValid(data);


        /*
           Force browser to begin image downloads
           immediately.
        */

        if(displayPassport.src){

            displayPassport.loading =
                "eager";
        }

        if(displaySign.src){

            displaySign.loading =
                "eager";
        }


        return true;


    }catch(error){

        console.error(
            "Verification error:",
            error
        );


        showInvalid();

        return false;
    }

}


/* =========================================================
   WAIT FOR IMAGES
========================================================= */

function waitForImage(img){

    return new Promise(
        function(resolve){

            /*
               No image.
            */

            if(!img.src){

                resolve();

                return;
            }


            /*
               Already loaded.
            */

            if(img.complete){

                resolve();

                return;
            }


            /*
               Loaded successfully.
            */

            img.onload =
                function(){

                    resolve();

                };


            /*
               Failed image should not block
               the verification page forever.
            */

            img.onerror =
                function(){

                    resolve();

                };


            /*
               Safety timeout.
            */

            setTimeout(
                resolve,
                700
            );

        }
    );

}


/* =========================================================
   MAIN LOADING PROCESS
========================================================= */

async function startVerification(){

    /*
       Start API request immediately.

       This happens while the spinner is visible.
    */

    const verificationPromise =
        getVerificationData();


    /*
       Minimum loader time.

       The loader remains visible for approximately
       1.1 seconds, matching your original design.
    */

    const minimumLoaderTime =
        new Promise(
            function(resolve){

                setTimeout(
                    resolve,
                    1100
                );

            }
        );


    /*
       Wait for both:

       1. Database information
       2. Minimum loader display time
    */

    await Promise.all([
        verificationPromise,
        minimumLoaderTime
    ]);


    /*
       Give the browser a moment to finish
       displaying the already-loaded images.
    */

    await Promise.all([
        waitForImage(displayPassport),
        waitForImage(displaySign)
    ]);


    /*
       Hide loader.
    */

    loader.style.display =
        "none";


    /*
       Show information page.
    */

    card.style.display =
        "block";

}


/* =========================================================
   START
========================================================= */

startVerification();


</script>

</body>
</html>
