<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Affidavit Validation</title>

<style>

/* =====================================================
   ORIGINAL PAGE
===================================================== */

body {
    background-color: #d1d5db;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}


/* =====================================================
   LOADER OVERLAY
===================================================== */

#loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #d1d5db;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 9999;
}


/* EXACT WHITE LOADER CARD */

.loader-card {
    background: white;

    padding: 50px;

    border-radius: 8px;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.1);

    display: flex;

    justify-content: center;
    align-items: center;

    width: 282px;
    height: 272px;
}


/* =====================================================
   EXACT SEGMENTED SPINNER
===================================================== */

.spinner {
    width: 60px;
    height: 60px;

    animation:
        spin 2s linear infinite;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}
/* =====================================================
   VERIFICATION CARD
===================================================== */

.card {

    background: white;

    padding: 40px 30px;

    border-radius: 8px;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.1);

    max-width: 400px;

    width: 77%;

    justify-content: center;
    align-items: center;

    text-align: center;

    position: fixed;

    display: none;
}


/* =====================================================
   PASSPORT + SIGNATURE
===================================================== */

.photo-container {

    display: flex;

    justify-content: center;

    gap: 20px;

    margin-bottom: 25px;
}


/* PASSPORT */

.passport-circle {

    width: 100px;
    height: 100px;

    border-radius: 50%;

    overflow: hidden;

    border: 1px solid #ddd;
}

.passport-circle img {

    width: 100%;
    height: 100%;

    object-fit: cover;

}


/* SIGNATURE */

.signature-box {

    width: 100px;
    height: 100px;

    display: flex;

    align-items: center;
    justify-content: center;
}

.signature-box img {

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}


/* =====================================================
   INFORMATION TEXT
===================================================== */

.info-text {

    color: #333;

    font-size: 15px;

    line-height: 1.5;

    margin-bottom: 20px;
}


/* GREEN TEXT */

.highlight-green {

    color: #27ae60;

    font-weight: bold;

}


/* INVALID */

.invalid {

    color: #e74c3c !important;

}


/* =====================================================
   GO TO LOGIN
===================================================== */

.login-link {

    display: block;

    text-align: right;

    color: #333;

    text-decoration: underline;

    font-size: 14px;

    margin-top: 20px;

}

</style>

</head>

<body>


<!-- =====================================================
     LOADER
===================================================== -->

<div id="loader-overlay">

    <div class="loader-card">

        <svg
            class="spinner"
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg"
        >

            <g fill="#333">

                <rect
                    x="47"
                    y="10"

                    height="20"
                    rx="3"
                    opacity="1"
                />

                <rect

                    rx="3"
                    transform="rotate(30 50 50)"

                />

                <rect

                    y="10"
                    width="6"
                    height="20"
                    rx="3"
                    transform="rotate(60 50 50)"
                    opacity="0.83"
                />

                <rect
                    x="47"
                    y="10"
                    width="6"
                    height="20"
                    rx="3"
                    transform="rotate(90 50 50)"
                    opacity="0.75"
                />

                <rect
                    x="47"
                    y="10"
                    width="6"
                    height="20"
                    rx="3"
                    transform="rotate(120 50 50)"
                    opacity="0.66"
                />

                <rect
                    x="47"
                    y="10"
                    width="6"
                    height="20"
                    rx="3"
                    transform="rotate(150 50 50)"
                    opacity="0.58"
                />

                <rect
                    x="47"
                    y="10"
                    width="6"
                    height="20"
                    rx="3"
                    transform="rotate(180 50 50)"
                    opacity="0.50"
                />

                <rect
                    x="47"
                    y="10"
                    width="6"
                    height="20"
                    rx="3"
                    transform="rotate(210 50 50)"
                    opacity="0.41"
                />

                <rect
                    x="47"
                    y="10"
                    width="6"
                    height="20"
                    rx="3"
                    transform="rotate(240 50 50)"
                    opacity="0.33"
                />

                <rect
                    x="47"
                    y="10"
                    width="6"
                    height="20"
                    rx="3"
                    transform="rotate(270 50 50)"
                    opacity="0.25"
                />

                <rect
                    x="47"
                    y="10"
                    width="6"
                    height="20"
                    rx="3"
                    transform="rotate(300 50 50)"
                    opacity="0.16"
                />

                <rect
                    x="47"
                    y="10"
                    width="6"
                    height="20"
                    rx="3"
                    transform="rotate(330 50 50)"
                    opacity="0.08"
                />

            </g>

        </svg>

    </div>

</div>


<!-- =====================================================
     VERIFICATION CARD
===================================================== -->

<div class="card" id="main-card">


    <!-- PASSPORT + SIGNATURE -->

    <div class="photo-container">

        <div class="passport-circle">

            <img
                id="display-passport"
                src=""
                alt="Passport"
            >

        </div>


        <div class="signature-box">

            <img
                id="display-sign"
                src=""
                alt="Signature"
            >

        </div>

    </div>


    <!-- INFORMATION -->

    <div class="info-text">

        This is a

        <span class="highlight-green">
            GENERAL FORM OF AFFIDAVIT
        </span>

        deposed by

        <span
            class="highlight-green"
            id="display-name"
        >
            -
        </span>

        associated with code

        <span
            class="highlight-green"
            id="display-code"
        >
            -
        </span>.

        It has been

        <span id="database-message">
            found in our database and confirmed as
        </span>

        <br>

        <span
            class="highlight-green"
            id="valid-status"
        >
            VALID
        </span>

    </div>


    <!-- GO TO LOGIN -->

    <a
        href="https://varms.fcthighcourt.gov.ng"
        class="login-link"
    >
        Go to Login
    </a>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycby_5UyMfyXI8yZdnrRR4IIh15edCDUw2Nv_IvTuvJZFstAYs18gB0HiIbN4ac5deTo_Mg/exec";


/* =====================================================
   ELEMENTS
===================================================== */

const loader =
document.getElementById("loader-overlay");

const card =
document.getElementById("main-card");

const passport =
document.getElementById("display-passport");

const signature =
document.getElementById("display-sign");

const displayName =
document.getElementById("display-name");

const displayCode =
document.getElementById("display-code");

const databaseMessage =
document.getElementById("database-message");

const validStatus =
document.getElementById("valid-status");


/* =====================================================
   GET QR CODE VALUE
===================================================== */

const urlParams =
new URLSearchParams(
    window.location.search
);

let affidavitCode =
urlParams.get("id") ||
urlParams.get("code") ||
urlParams.get("affidavitCode") ||
"";


affidavitCode =
decodeURIComponent(affidavitCode)
.trim()
.toUpperCase();


/* =====================================================
   GOOGLE DRIVE IMAGE CONVERTER
===================================================== */

function convertDriveURL(url) {

    if (!url) {
        return "";
    }

    url = String(url).trim();


    /*
       Current Apps Script returns:

       https://drive.google.com/uc?export=view&id=FILE_ID
    */

    let match =
        url.match(
            /[?&]id=([^&]+)/i
        );

    if (match) {

        return (
            "https://drive.google.com/thumbnail?id=" +
            encodeURIComponent(match[1]) +
            "&sz=w1000"
        );

    }


    /*
       Standard Drive URL
    */

    match =
        url.match(
            /\/d\/([^/]+)/i
        );

    if (match) {

        return (
            "https://drive.google.com/thumbnail?id=" +
            encodeURIComponent(match[1]) +
            "&sz=w1000"
        );

    }


    return url;
}


/* =====================================================
   INVALID AFFIDAVIT
===================================================== */

function showInvalid() {

    displayName.textContent =
        "UNKNOWN";

    displayCode.textContent =
        affidavitCode ||
        "UNKNOWN";

    databaseMessage.textContent =
        "could not be found in our database";

    validStatus.textContent =
        "INVALID";

    validStatus.classList.add(
        "invalid"
    );

    passport.removeAttribute("src");

    signature.removeAttribute("src");
}


/* =====================================================
   VERIFY
===================================================== */

async function verifyAffidavit() {

    if (!affidavitCode) {

        showInvalid();

        return;
    }


    /*
       Show scanned code immediately
    */

    displayCode.textContent =
        affidavitCode;


    try {

        const requestURL =
            API +
            "?action=verifyAffidavit" +
            "&affidavitCode=" +
            encodeURIComponent(affidavitCode) +
            "&id=" +
            encodeURIComponent(affidavitCode) +
            "&t=" +
            Date.now();


        const response =
            await fetch(
                requestURL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Verification server error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "Verification result:",
            result
        );


        /*
           No record
        */

        if (
            !result ||
            result.success !== true ||
            result.found !== true
        ) {

            showInvalid();

            return;
        }


        const data =
            result.data || {};


        /* =================================================
           NAME
        ================================================= */

        displayName.textContent =
            String(
                data.name ||
                "UNKNOWN"
            ).toUpperCase();


        /* =================================================
           CODE
        ================================================= */

        displayCode.textContent =
            data.affidavitCode ||
            affidavitCode;


        /* =================================================
           PASSPORT
        ================================================= */

        if (data.passportUrl) {

            const passportURL =
                convertDriveURL(
                    data.passportUrl
                );

            passport.src =
                passportURL;

        }


        /* =================================================
           SIGNATURE
        ================================================= */

        if (data.signatureUrl) {

            const signatureURL =
                convertDriveURL(
                    data.signatureUrl
                );

            signature.src =
                signatureURL;

        }


        /* =================================================
           VALID
        ================================================= */

        databaseMessage.textContent =
            "found in our database and confirmed as";

        validStatus.textContent =
            "VALID";

        validStatus.classList.remove(
            "invalid"
        );


    } catch (error) {

        console.error(
            "Verification error:",
            error
        );

        showInvalid();

    }

}


/* =====================================================
   START
===================================================== */

verifyAffidavit();


/* =====================================================
   EXACT LOADER TIMING
===================================================== */

setTimeout(
    function () {

        loader.style.display =
            "none";

        card.style.display =
            "block";

    },
    1100
);

</script>

</body>
</html>
