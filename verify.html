<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affidavit Validation</title>

<style>

body{
    margin:0;
    background:#d1d5db;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
}

.card{
    display:none;
    background:#fff;
    padding:40px 30px;
    border-radius:8px;
    box-shadow:0 10px 25px #999;
    max-width:400px;
    width:77%;
    text-align:center;
}

.photos{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:25px;
}

.pass{
    width:100px;
    height:100px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid #ddd;
}

.pass img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.sig{
    width:100px;
    height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.sig img{
    max-width:100%;
    max-height:100%;
}

.green{
    color:#27ae60;
    font-weight:bold;
    
}

.invalid{
    color:#e74c3c!important;
}

#loader{
    position:fixed;
    inset:0;
    background:#d1d5db;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.spin{
    width:45px;
    height:45px;
    border:6px solid #999;
    border-top-color:#222;
    border-radius:50%;
    animation:s 1s linear infinite;
}

@keyframes s{
    to{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body>

<div id="loader">
    <div class="spin"></div>
</div>

<div class="card" id="card">

    <div class="photos">

        <div class="pass">
            <img id="p" src="" alt="Passport">
        </div>

        <div class="sig">
            <img id="s" src="" alt="Signature">
        </div>

    </div>

    <div>

        This is a
        <span class="green">
            GENERAL FORM OF AFFIDAVIT
        </span>

        deposed by

        <span id="name" class="green" style="text-transform: uppercase;">
            -
        </span>

        associated with code

        <span id="code" class="green">
            -
        </span>.

        It has been

        <span id="db">
            found in our database and confirmed as
        </span>

        <br>

        <span id="valid" class="green">
            VALID
        </span>

    </div>

</div>


<script>

/******************************************************
 * GOOGLE APPS SCRIPT API
 ******************************************************/

const API =
"https://script.google.com/macros/s/AKfycby_5UyMfyXI8yZdnrRR4IIh15edCDUw2Nv_IvTuvJZFstAYs18gB0HiIbN4ac5deTo_Mg/exec";


/******************************************************
 * ELEMENTS
 ******************************************************/

const loader =
document.getElementById("loader");

const card =
document.getElementById("card");

const passport =
document.getElementById("p");

const signature =
document.getElementById("s");

const nameElement =
document.getElementById("name");

const codeElement =
document.getElementById("code");

const databaseElement =
document.getElementById("db");

const validElement =
document.getElementById("valid");


/******************************************************
 * GET CODE FROM QR URL
 *
 * Supports:
 *
 * ?id=XXXXXXXXXXXXX
 *
 * ?code=XXXXXXXXXXXXX
 *
 * ?affidavitCode=XXXXXXXXXXXXX
 ******************************************************/

const params =
new URLSearchParams(
    window.location.search
);

let wanted =
params.get("id") ||
params.get("code") ||
params.get("affidavitCode") ||
"";

wanted =
decodeURIComponent(wanted)
.trim()
.toUpperCase();


/******************************************************
 * INVALID DISPLAY
 ******************************************************/

function showInvalid(){

    nameElement.textContent =
        "UNKNOWN";

    codeElement.textContent =
        wanted || "UNKNOWN";

    databaseElement.textContent =
        "could not be found in our database";

    validElement.textContent =
        "INVALID";

    validElement.classList.add(
        "invalid"
    );

    passport.removeAttribute("src");
    signature.removeAttribute("src");

}


/******************************************************
 * DRIVE IMAGE URL
 *
 * Converts Google Drive URLs into a format
 * suitable for displaying the image.
 ******************************************************/

function driveImageUrl(url){

    if(!url){
        return "";
    }

    url =
        String(url).trim();

    /*
     * Already a direct image URL.
     */
    if(
        url.indexOf("uc?export=view") !== -1
    ){

        const match =
        url.match(
            /[?&]id=([^&]+)/
        );

        if(match){

            return (
                "https://drive.google.com/thumbnail?id=" +
                encodeURIComponent(match[1]) +
                "&sz=w1000"
            );

        }

        return url;
    }


    /*
     * Google Drive file URL.
     */
    let match =
    url.match(
        /\/d\/([^/]+)/
    );

    if(match){

        return (
            "https://drive.google.com/thumbnail?id=" +
            encodeURIComponent(match[1]) +
            "&sz=w1000"
        );

    }


    /*
     * Google Drive URL containing ?id=
     */
    match =
    url.match(
        /[?&]id=([^&]+)/
    );

    if(match){

        return (
            "https://drive.google.com/thumbnail?id=" +
            encodeURIComponent(match[1]) +
            "&sz=w1000"
        );

    }


    return url;
}


/******************************************************
 * VERIFY AFFIDAVIT
 ******************************************************/

async function verifyAffidavit(){

    if(!wanted){

        showInvalid();

        return;
    }


    /*
     * Immediately display scanned code.
     */

    codeElement.textContent =
        wanted;


    /*
     * Build API URL.
     *
     * We send BOTH id and affidavitCode.
     * This makes it compatible with the current
     * Apps Script.
     */

    const apiUrl =
        API +
        "?action=verifyAffidavit" +
        "&affidavitCode=" +
        encodeURIComponent(wanted) +
        "&id=" +
        encodeURIComponent(wanted) +
        "&t=" +
        Date.now();


    try{

        console.log(
            "Verification request:",
            apiUrl
        );


        const response =
            await fetch(
                apiUrl,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "Apps Script response:",
            result
        );


        /*
         * No record found.
         */

        if(
            !result ||
            result.success !== true ||
            result.found !== true
        ){

            showInvalid();

            return;
        }


        /*
         * Get returned data.
         */

        const d =
            result.data || {};


        /************************************************
         * NAME
         ************************************************/

        nameElement.textContent =
            d.name ||
            "UNKNOWN";


        /************************************************
         * AFFIDAVIT CODE
         ************************************************/

        codeElement.textContent =
            d.affidavitCode ||
            wanted;


        /************************************************
         * PASSPORT
         ************************************************/

        if(d.passportUrl){

            const passportUrl =
                driveImageUrl(
                    d.passportUrl
                );

            passport.src =
                passportUrl;

            passport.onerror =
            function(){

                console.error(
                    "Passport image could not be displayed:",
                    passportUrl
                );

            };

        }else{

            passport.removeAttribute(
                "src"
            );

        }


        /************************************************
         * SIGNATURE
         ************************************************/

        if(d.signatureUrl){

            const signatureUrl =
                driveImageUrl(
                    d.signatureUrl
                );

            signature.src =
                signatureUrl;

            signature.onerror =
            function(){

                console.error(
                    "Signature image could not be displayed:",
                    signatureUrl
                );

            };

        }else{

            signature.removeAttribute(
                "src"
            );

        }


        /************************************************
         * VALID STATUS
         ************************************************/

        databaseElement.textContent =
            "found in our database and confirmed as";

        validElement.textContent =
            "VALID";

        validElement.classList.remove(
            "invalid"
        );


    }catch(error){

        console.error(
            "Verification error:",
            error
        );

        showInvalid();

    }

}


/******************************************************
 * START VERIFICATION
 ******************************************************/

verifyAffidavit();


/******************************************************
 * LOADER
 *
 * Keeps your original 1.1 second design.
 ******************************************************/

setTimeout(
    function(){

        loader.style.display =
            "none";

        card.style.display =
            "block";

    },
    1100
);

</script>

</body>
</html>
